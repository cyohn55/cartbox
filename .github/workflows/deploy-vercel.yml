# Deterministic production deploy to Vercel.
#
# Why this exists: pushing to main creates a Vercel Production deployment that
# builds "Ready", but the production alias (cartbox-web-bfug.vercel.app) was not
# being promoted to it — so new code (e.g. the cartbox.sun/spot SDK) never went
# live. This workflow deploys apps/web to production with the Vercel CLI, which
# both builds AND promotes to the production domain, so a push is always live.
#
# One-time setup — add three repo secrets (Settings → Secrets and variables →
# Actions), values from `vercel link` in apps/web (.vercel/project.json) and a
# token from vercel.com → Account Settings → Tokens:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#
# The CLI respects the linked project's Root Directory (apps/web) and pulls the
# project's own production env vars, so no app secrets are duplicated here.
#
# NOTE: the Vercel Git integration may still create its own (unpromoted) build on
# each push — harmless, but you can turn its Production deploys off in the Vercel
# project's Git settings once this workflow is the source of truth.

name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip cleanly (rather than fail) until the secrets are configured.
    if: ${{ github.repository == 'cyohn55/cartbox' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Guard — secrets present
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel secrets not set (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID) — skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnose token scope
        if: steps.guard.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "whoami:"; npx --yes vercel@latest whoami --token="$VERCEL_TOKEN" || true
          echo "teams the token can see:"; npx --yes vercel@latest teams ls --token="$VERCEL_TOKEN" || true

      # Remote build: upload the monorepo and let Vercel build apps/web using the
      # project's configured Root Directory (exactly like the Git integration),
      # then --prod promotes it to the production domain. VERCEL_ORG_ID/PROJECT_ID
      # (job env) select the project; --scope pins the team so a personal token
      # that merely *belongs* to the team still resolves it.
      - name: Deploy + promote to production
        if: steps.guard.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -e
          URL=$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" --scope="$SCOPE")
          echo "Deployed and promoted to production: $URL"
          # `deploy --prod` already promotes to the production domain. A belt-and-
          # suspenders `promote` then reports 409 "already the current production
          # deployment" — which is success, not failure — so tolerate that case.
          echo "Confirming promotion…"
          if ! out=$(npx --yes vercel@latest promote "$URL" --yes --token="$VERCEL_TOKEN" --scope="$SCOPE" 2>&1); then
            echo "$out"
            echo "$out" | grep -qi "already the current production deployment" \
              && echo "→ already live in production (ok)" \
              || { echo "promote failed for a real reason"; exit 1; }
          fi
