<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport" />
  <title>DOS (Cartbox)</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    /* The canvas fills the frame with no border or padding — DOSBox derives its
       mouse coordinates from the canvas rect, and the host sizes the iframe.
       image-rendering:auto lets the browser smooth the upscale of the low DOS
       resolution rather than showing hard-edged giant pixels. */
    canvas {
      border: 0; margin: 0; padding: 0; display: block;
      width: 100%; height: 100%;
      image-rendering: auto;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    // Keep an optional cache from wedging the engine. MUST run before js-dos.js.
    //
    // js-dos opens an IndexedDB ("js-dos-cache (<version>)") to memoise the
    // wdosbox binary, and starts DOSBox from that request's callbacks. It handles
    // `onerror` — falling back to a no-op cache, so the cache is provably
    // optional — but a database that fires *no* event at all has no handler, and
    // a profile whose IndexedDB is wedged reaches exactly that state. The boot
    // then stops before the engine exists: no error, no canvas, an indefinite
    // "LOADING GAME…". Every DOS title fails and nothing else does, because
    // js-dos is the only runtime here that touches IndexedDB.
    //
    // The fix is to give the open request a deadline and synthesise the failure
    // js-dos already knows how to handle, so a broken cache costs a re-download
    // instead of the whole game. Scoped to this iframe, which runs nothing else.
    window.CARTBOX_IDB_OPEN_TIMEOUT_MS = 5000;

    function guardIndexedDbOpen(factory, timeoutMs, setTimer) {
      if (!factory || typeof factory.open !== "function") return factory;
      var schedule = setTimer || window.setTimeout.bind(window);

      return {
        open: function (name, version) {
          var settled = false;
          var request = null;
          var openThrew = null;

          // The shim stands in for the real IDBOpenDBRequest: js-dos assigns the
          // three handlers and reads `.result` off whatever open() returned.
          var shim = {
            onerror: null,
            onsuccess: null,
            onupgradeneeded: null,
            onblocked: null,
            get result() {
              return request ? request.result : null;
            },
          };

          var fail = function (detail) {
            if (settled) return;
            settled = true;
            if (typeof shim.onerror === "function") shim.onerror(detail);
          };

          // js-dos memoises the DOSBox engine binary in its own IndexedDB, then
          // feeds the stored bytes straight to WebAssembly.compile() with no
          // length check. A profile whose entry is truncated or empty makes
          // compile throw "expected 4 bytes, fell off end @+0" on *every* launch,
          // and a wedged or storage-blocked open hangs it — two real failures
          // from one optional store. The browser's HTTP cache already memoises
          // wdosbox correctly and with integrity, so this copy is pure downside:
          // deny the cache database so js-dos falls back to its no-op cache and
          // downloads the engine fresh, and never read or write the poison entry.
          // Scoped by name so game-save IDBFS databases keep working normally.
          if (typeof name === "string" && name.indexOf("js-dos-cache") === 0) {
            schedule(function () {
              fail({ target: shim, cartboxCacheBypassed: true });
            }, 0);
            return shim;
          }

          // open() is not always safe to call either: a sandboxed or storage-
          // partitioned iframe (this DOS player runs in one) makes it throw
          // *synchronously* — typically a SecurityError, "access to the Indexed
          // Database API is denied in this context." js-dos does not guard the
          // call, so an unswallowed throw would abort a save mount with no
          // fallback. Take the same failure path as a timeout.
          try {
            request = factory.open(name, version);
          } catch (error) {
            openThrew = error;
          }

          if (openThrew) {
            // open() returns before js-dos assigns shim.onerror, so the failure
            // must fire asynchronously (after the caller has wired its handler).
            schedule(function () {
              fail({ target: shim, cartboxOpenThrew: true, error: openThrew });
            }, 0);
            return shim;
          }

          var forward = function (name) {
            return function (event) {
              if (settled) return;
              // upgradeneeded is a step on the way to success, not an outcome:
              // the database is demonstrably alive, so only stop the clock.
              if (name !== "onupgradeneeded") settled = true;
              if (typeof shim[name] === "function") shim[name](event);
            };
          };
          request.onsuccess = forward("onsuccess");
          request.onupgradeneeded = forward("onupgradeneeded");
          request.onerror = forward("onerror");
          // A blocked open never completes on its own; treat it as a failure so
          // js-dos takes its no-op cache path rather than waiting forever.
          request.onblocked = forward("onerror");

          schedule(function () {
            fail({ target: shim, cartboxTimedOut: true });
          }, timeoutMs);

          return shim;
        },
      };
    }

    // Guard the real factory in the browser; the export is for the unit test,
    // which drives this exact function with a database that never answers.
    if (typeof window !== "undefined" && window.indexedDB) {
      var guarded = guardIndexedDbOpen(window.indexedDB, window.CARTBOX_IDB_OPEN_TIMEOUT_MS);
      try {
        Object.defineProperty(window, "indexedDB", {
          configurable: true,
          get: function () {
            return guarded;
          },
        });
      } catch (error) {
        // A browser that refuses the override keeps the unguarded factory; the
        // boot watchdog below still bounds the damage.
      }
    }
  </script>
  <script src="js-dos.js"></script>
  <script>
    // Which game to boot comes from the fragment as "<bundle>:<exe>" or
    // "<bundle>:<exe>:<cd-image>", e.g. cartbox-boot.html#cdogs:CDOGS.EXE or
    // #cnc:C&C.COM:CNC.ISO — <bundle>.zip is fetched relative to this page (so any
    // base path, dev or the /cartbox Pages prefix, just works) and <exe> is run
    // inside DOSBox. A third field names an ISO (packed into <bundle>.zip) that is
    // mounted as a CD-ROM drive before launch — some games (C&C) refuse to run
    // without a CD present. Splitting on ":" is safe: DOS paths separate with "\".
    // Defaulting to C-Dogs keeps a bare open of the page useful.
    function parseTarget() {
      var raw = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
      if (!raw) return { bundle: "cdogs", exe: "CDOGS.EXE", cd: null };
      var parts = raw.split(":");
      return { bundle: parts[0], exe: parts[1] || "CDOGS.EXE", cd: parts[2] || null };
    }

    function post(type, extra) {
      var message = { source: "cartbox-dos", type: type };
      if (extra) for (var key in extra) message[key] = extra[key];
      parent.postMessage(message, "*");
    }

    // Set once the game is running, so post-boot noise can't flip a running
    // game to GAME ERROR (see the unhandledrejection net below).
    var booted = false;

    // Surface a hard failure to the host rather than hanging on a black canvas.
    window.addEventListener("error", function (event) {
      post("error", { message: String(event.message) });
    });

    // js-dos brings the engine up inside a Promise whose rejection it never
    // forwards, and `.ready()` attaches no reject handler — so a bring-up
    // failure (a thrown IndexedDB open, a WASM instantiate error) is a *silent*
    // rejection, invisible until the 45s engine watchdog fires. Report it the
    // moment it happens, but only before boot: once the game is running, later
    // rejections are background noise and must not tear down a live session.
    window.addEventListener("unhandledrejection", function (event) {
      if (booted) return;
      var reason = event && event.reason;
      var detail = reason && reason.message ? reason.message : String(reason);
      post("error", { message: "engine bring-up failed: " + detail });
    });

    /**
     * Bounds each boot stage so a stall is reported instead of hung on.
     *
     * Every *failure* here already reaches the host, but "the engine never
     * called back" is not a failure — no promise rejects and no error fires, so
     * without this the loader spins for as long as the player is willing to
     * wait. The two stages get very different budgets on purpose: bringing the
     * engine up is local work (a 1.8MB script plus the cache open) and should
     * take seconds, while extracting the game means downloading up to 13MB,
     * which is legitimately slow on a bad connection and must not be cut short.
     */
    var ENGINE_STAGE_TIMEOUT_MS = 45000;
    var EXTRACT_STAGE_TIMEOUT_MS = 300000;

    function stageWatchdog(stage, timeoutMs) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        post("error", { message: "timed out waiting for " + stage, stage: stage });
      }, timeoutMs);
      return function clear() {
        done = true;
        clearTimeout(timer);
      };
    }

    (function () {
      var target = parseTarget();
      var canvas = document.getElementById("canvas");

      // js-dos 6.22: Dos(canvas, options).ready(fs, main). wdosboxUrl is resolved
      // relative to this page, and its sibling wdosbox.wasm.js is located the same
      // way, so the engine is base-path independent. (6.22's onprogress reports a
      // stage label, not a percentage, so the host just shows an indeterminate
      // "LOADING…" until runtime-initialized rather than a bogus number.)
      var engineReady = stageWatchdog("the DOSBox engine to start", ENGINE_STAGE_TIMEOUT_MS);

      Dos(canvas, {
        wdosboxUrl: "wdosbox.js",
        cycles: "auto",
        autolock: false,
      }).ready(function (fs, main) {
        engineReady();
        var extracted = stageWatchdog("the game files to download", EXTRACT_STAGE_TIMEOUT_MS);

        fs.extract(target.bundle + ".zip")
          .then(function () {
            extracted();
            // Optional per-game overlay: extra files that must sit in C: next to
            // the game but cannot be baked into its distribution archive (a
            // "distribute unmodified" title like C-Dogs). <bundle>.files.json maps
            // a DOS path to the base64 bytes to write there — e.g. a pre-made
            // SOUND.CFG so the game finds a sound device instead of failing setup.
            return applyOverlay(fs, target.bundle);
          })
          .then(function () {
            // A CD-backed game mounts its ISO (extracted to C: from the zip) as a
            // CD-ROM drive D: before running the exe, so the game's CD check passes.
            var commands = target.cd
              ? ["-c", "imgmount d " + target.cd + " -t iso -fs iso", "-c", target.exe]
              : ["-c", target.exe];
            main(commands);
            // DOSBox is now running the game; the host can drop the loader, and
            // post-boot rejections are no longer bring-up failures.
            booted = true;
            post("runtime-initialized");
          })
          .catch(function (error) {
            // A real failure is the more precise report, so retire the watchdog
            // rather than letting it fire a second, vaguer error afterwards.
            extracted();
            post("error", { message: "boot failed: " + String(error) });
          });
      });
    })();

    function applyOverlay(fs, bundle) {
      return fetch(bundle + ".files.json")
        .then(function (response) {
          return response.ok ? response.json() : {};
        })
        .then(function (files) {
          Object.keys(files).forEach(function (path) {
            var binary = atob(files[path]);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            fs.createFile(path, bytes);
          });
        })
        .catch(function () {
          // No overlay for this game, or it failed to load — the game may still
          // run (C-Dogs only needs a keypress past its sound warning), so this is
          // not fatal.
        });
    }
  </script>
</body>
</html>
