<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport" />
  <title>OpenTTD (Cartbox)</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    canvas.emscripten {
      border: 0; margin: 0; padding: 0; display: block;
      width: 100%; height: 100%;
      image-rendering: auto;
      background: #000;
      outline: none;
    }
    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #06040c; color: #d7d7d7; font: 600 13px arial; text-align: center; padding: 0 16px;
    }
    #message { margin-top: 10px; color: #fff9; font-size: 11px; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="title">Loading…</div>
    <div id="message"></div>
  </div>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    // Bridge engine lifecycle to the console host (OpenTtdPlayer) so it can drop its
    // own loading overlay and surface hard errors without polling pixels.
    function postToHost(msg) {
      try { parent.postMessage(Object.assign({ source: "cartbox-openttd" }, msg), "*"); } catch (e) {}
    }
    var titleEl = document.getElementById("title");
    var messageEl = document.getElementById("message");
    var overlayEl = document.getElementById("overlay");
    function setText(t, m) { if (titleEl) titleEl.innerHTML = t; if (messageEl) messageEl.innerHTML = m || ""; }
    function hideCanvasOverlay(t, m) { if (overlayEl) overlayEl.style.display = "flex"; setText(t, m); }

    // OpenTTD's pre.js (baked into openttd.js) and runtime call into these. We keep
    // the full contract shell.html defines, but route progress/readiness/errors to
    // the host and never depend on OpenTTD's own branded loading DOM.
    var Module = {
      preRun: [], postRun: [], arguments: [],
      totalDependencies: 42, doneDependencies: 0, lastDependencies: 1,
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
      canvas: (function () {
        var c = document.getElementById("canvas");
        c.addEventListener("webglcontextlost", function (e) {
          postToHost({ type: "error", message: "WebGL context lost" });
          e.preventDefault();
        }, false);
        c.addEventListener("click", function () { c.focus(); });
        return c;
      })(),
      // Emscripten's file-packager reports .data download/instantiation as
      // "note (loaded/total)"; relay it to the host progress bar.
      setStatus: function (text) {
        var m = text && text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          var loaded = parseInt(m[2]), total = parseInt(m[4]);
          if (total > 0) postToHost({ type: "progress", loaded: loaded, total: total });
        }
      },
      monitorRunDependencies: function (left) {
        if (left < Module.lastDependencies) Module.doneDependencies += 1;
        Module.lastDependencies = left;
        // When the last run dependency clears, the preloaded FS + IDBFS sync are
        // done and the game is starting — tell the host to drop its overlay.
        if (left === 0) {
          if (overlayEl) overlayEl.style.display = "none";
          postToHost({ type: "runtime-initialized" });
        }
      },
      // OpenGFX is bundled, so the bootstrap (base-graphics download) path should
      // never run; if it ever does, surface it as an error rather than a black
      // canvas, since this build is meant to be self-contained.
      onBootstrap: function (current, total) {
        hideCanvasOverlay("Missing base graphics", "Downloading… " + current + " / " + total);
      },
      onBootstrapFailed: function () {
        postToHost({ type: "error", message: "Missing base graphics" });
      },
      onBootstrapReload: function () {
        hideCanvasOverlay("Preparing…", "Reloading to start the game.");
      },
      onExit: function () { hideCanvasOverlay("Thanks for playing!", "Eject to return."); },
      onAbort: function () { postToHost({ type: "error", message: "OpenTTD aborted" }); },
      // First-time persistent-storage warning; harmless, no UI needed here.
      onWarningFs: function () {},
    };
    window.Module = Module;

    // Turn a runtime abort into a host error instead of a black canvas.
    window.onerror = function (message) { postToHost({ type: "error", message: String(message) }); };
  </script>
  <script async src="openttd.js"></script>
</body>
</html>
